<div class="inv-input-group">
    <div class="inv-group-header">Project & Fixed Costs</div>
    <label>Analysis Period (Yrs): <input type="number" id="inv-analysisPeriod" step="1" min="1" max="30"></label>
    <label>MARR / Discount Rate (%): <input type="number" id="inv-marr" step="0.1" min="0"></label>
    <label>Corporate Tax Rate (%): <input type="number" id="inv-taxRate" step="0.1" min="0" max="100"></label>
    <label>Working Days per Year: <input type="number" id="inv-workingDays" step="1" min="1" max="365"></label>
    <label>Mfg. Overhead ($/yr): <input type="text" data-type="currency" id="inv-mfgOverhead"></label>
    <label>SG&A Expenses ($/yr): <input type="text" data-type="currency" id="inv-sgaExpenses"></label>
</div>
<div class="inv-input-group">
    <div class="inv-group-header">Capital Investment</div>
    <label>Cost / ft of Straights ($): <input type="text" data-type="currency" id="inv-costPerFootStraight"></label>
    <label>Cost / Conveyor Bend ($): <input type="text" data-type="currency" id="inv-costPerBend"></label>
    <label>Installation Cost ($): <input type="text" data-type="currency" id="inv-installationCost"></label>
    <label>Salvage Value ($): <input type="text" data-type="currency" id="inv-salvageValue"></label>
    <label>MACRS Class:<select id="inv-macrsClass">
            <option value="5-year">5-Year Property</option>
            <option value="7-year">7-Year Property</option>
        </select></label>
</div>
<div class="inv-input-group">
    <div class="inv-group-header">Probabilistic Demand Scenarios<div class="inv-group-subheader">(Annual Units)</div>
    </div>
    <label>Std. Deviation (STD): <input type="text" data-type="currency" id="inv-std"></label>
    <label>Coeff. of Variation (CV %): <input type="number" id="inv-cv" step="0.1" min="0"></label>
    <label>Confidence Interval:<select id="inv-ciLevel">
            <option value="90">90%</option>
            <option value="95">95%</option>
            <option value="99">99%</option>
        </select></label>
    <div class="inv-ci-display">Range: <span id="inv-ci-range"></span></div>
    <hr class="inv-divider">
    <label>P10 (Conservative): <input type="text" data-type="currency" id="inv-p10Demand"></label>
    <div class="inv-p50-display"><span>P50 (Expected Value):</span><span id="inv-p50Demand"></span></div>
    <label>P90 (Optimistic): <input type="text" data-type="currency" id="inv-p90Demand"></label>
</div>
